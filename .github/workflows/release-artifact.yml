name: Release Artifact

# Publishes @chronary/mcp (MCP server for AI assistants) to npm and creates a GitHub Release.
# The CLI binary remains `chronary-mcp` (so `chronary-mcp --help` still works after install);
# only the npm install path is @chronary/mcp.
#
# Provenance posture:
#   - Publishes via npm OIDC Trusted Publishing — no NPM_TOKEN required.
#     The `id-token: write` permission and `registry-url` on setup-node
#     are sufficient once chronary-mcp is registered as a Trusted
#     Publisher for @chronary/mcp on npmjs.com.
#   - npm CLI >= 11.5.1 is required for OIDC trusted publishing; we
#     pin npm to latest before publishing because Node 22 ships with
#     npm 10.x by default.
#   - `npm publish --provenance` records a Sigstore attestation that
#     links the published tarball back to this workflow run.
#   - GitHub artifact attestations also fire on public repos via
#     actions/attest-build-provenance.
#
# Official MCP Registry posture:
#   - After npm publish, server.json is published to the Official MCP Registry
#     (registry.modelcontextprotocol.io) so registry-driven installs resolve the
#     same version as npm. The `ai.chronary` namespace is DNS-verified via a TXT
#     record on chronary.ai; publishing needs the matching Ed25519 private key as
#     the MCP_REGISTRY_DNS_KEY repo secret (64-char hex — see README). The step is
#     gated on publish_registry=true + public repo + the secret being present, and
#     tolerates an already-published version (registry versions are immutable), so
#     it is a no-op until the key is provisioned and never blocks the npm release.
#
# Workspace dep posture:
#   - package.json declares @chronary/sdk and @chronary/toolkit via
#     "workspace:*". Those only resolve inside the monorepo. The
#     pre-install step below rewrites both to exact published npm
#     versions (`^${version}`) before `pnpm install` runs so the
#     mirror can install from the registry.
#
# Prerequisites (one-time, on flip to public-registry):
#   1. chronary-mcp is public on GitHub.
#   2. @chronary/sdk and @chronary/toolkit are published on npm (this
#      workflow looks them up via `npm view`).
#   3. First publish must use a classic token from local (npm has no
#      "Pending Publisher" flow — see npm/cli#8544). After that, register
#      Trusted Publisher on npmjs.com → @chronary/mcp → Access tab →
#      repo `Chronary/chronary-mcp`, workflow `release-artifact.yml`,
#      environment blank.
#   4. NPM_TOKEN repo secret (if any) has been deleted.
#   5. MCP_REGISTRY_DNS_KEY repo secret is set to the Ed25519 private key
#      (64-char hex) whose public half is in the chronary.ai DNS TXT record
#      (`v=MCPv1; k=ed25519; p=...`). Required only for the MCP Registry publish;
#      without it that step self-skips with a warning.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: |
          # npm install -g npm@latest fails when the runner's bundled npm is incomplete
          # (e.g. missing promise-retry on Node 22.22+). Bypass by downloading the
          # tarball directly into the existing module directory.
          NPM_DIR="$(node -e "process.stdout.write(require('path').resolve(process.execPath,'../../lib/node_modules/npm'))")"
          curl -fsSL https://registry.npmjs.org/npm/-/npm-11.5.1.tgz -o /tmp/npm.tgz
          tar -xzf /tmp/npm.tgz --strip-components=1 -C "$NPM_DIR"
          npm --version

      - name: Validate release manifest
        id: manifest
        run: |
          node -e "const fs=require('fs'); const manifest=JSON.parse(fs.readFileSync('.chronary-release.json','utf8')); if (manifest.artifact !== 'mcp') throw new Error('Expected artifact mcp'); if (manifest.public_tag !== process.env.GITHUB_REF_NAME) throw new Error('Tag mismatch between manifest and workflow ref'); require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'publish_registry=' + String(Boolean(manifest.publish_registry)) + '\n');"
          test -f RELEASE_NOTES.txt

      # Workspace rewrite and the steps that depend on it (install/build/publish)
      # are gated on publish_registry=true. When false, @chronary/toolkit may not
      # yet be on npm (it ships before mcp does), so npm view would fail.
      # Source-only releases skip the rewrite and ship the working tree as-is.
      - name: Rewrite workspace:* deps to published npm versions
        if: steps.manifest.outputs.publish_registry == 'true'
        run: |
          set -euo pipefail
          SDK_VERSION="$(npm view @chronary/sdk version)"
          TOOLKIT_VERSION="$(npm view @chronary/toolkit version)"
          if [ -z "${SDK_VERSION}" ]; then
            echo "::error::npm view @chronary/sdk version returned empty — cannot rewrite workspace:* dep" >&2
            exit 1
          fi
          if [ -z "${TOOLKIT_VERSION}" ]; then
            echo "::error::npm view @chronary/toolkit version returned empty — cannot rewrite workspace:* dep" >&2
            exit 1
          fi
          echo "Rewriting @chronary/sdk workspace:* -> ^${SDK_VERSION}"
          echo "Rewriting @chronary/toolkit workspace:* -> ^${TOOLKIT_VERSION}"
          SDK_VERSION="${SDK_VERSION}" TOOLKIT_VERSION="${TOOLKIT_VERSION}" node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const sdkV = process.env.SDK_VERSION;
            const tkV = process.env.TOOLKIT_VERSION;
            if (p.dependencies && p.dependencies['@chronary/sdk'] === 'workspace:*') {
              p.dependencies['@chronary/sdk'] = '^' + sdkV;
            } else {
              throw new Error('Expected dependencies[\"@chronary/sdk\"] === \"workspace:*\"; got ' + JSON.stringify(p.dependencies && p.dependencies['@chronary/sdk']));
            }
            if (p.dependencies && p.dependencies['@chronary/toolkit'] === 'workspace:*') {
              p.dependencies['@chronary/toolkit'] = '^' + tkV;
            } else {
              throw new Error('Expected dependencies[\"@chronary/toolkit\"] === \"workspace:*\"; got ' + JSON.stringify(p.dependencies && p.dependencies['@chronary/toolkit']));
            }
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          if grep -q '"workspace:\*"' package.json; then
            echo "::error::package.json still contains workspace:* after rewrite" >&2
            cat package.json
            exit 1
          fi
          grep '"@chronary/sdk"\|"@chronary/toolkit"' package.json

      - name: Install dependencies
        if: steps.manifest.outputs.publish_registry == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Validate package contents
        run: |
          test -f README.md
          test -f LICENSE
          test -f CHANGELOG.md

      - name: Typecheck
        if: steps.manifest.outputs.publish_registry == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.manifest.outputs.publish_registry == 'true'
        run: pnpm test

      - name: Build
        if: steps.manifest.outputs.publish_registry == 'true'
        run: pnpm build

      - name: Pack tarball
        if: steps.manifest.outputs.publish_registry == 'true'
        run: pnpm pack

      - name: Attest build provenance for npm tarball
        if: steps.manifest.outputs.publish_registry == 'true' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: '*.tgz'

      - name: Publish to npm
        if: steps.manifest.outputs.publish_registry == 'true'
        run: npm publish *.tgz --provenance --access public

      - name: Create GitHub Release
        run: |
          if [ "${{ steps.manifest.outputs.publish_registry }}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" *.tgz \
              --title "@chronary/mcp ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.txt
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "@chronary/mcp ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.txt
          fi

      # ── Official MCP Registry (registry.modelcontextprotocol.io) ──────────────
      # Keeps the registry entry in lockstep with npm so registry-driven installs
      # resolve the same version. server.json (projected to the mirror root by the
      # coordinator) declares name `ai.chronary/mcp`; the `ai.chronary` namespace
      # is DNS-verified via a TXT record on chronary.ai, so publishing needs the
      # matching Ed25519 private key (MCP_REGISTRY_DNS_KEY, 64-char hex).
      #
      # Gated on publish_registry=true + public repo. Self-skips (warning, exit 0)
      # when the secret is absent so it never blocks the npm release before the key
      # is provisioned. Registry versions are immutable, so an already-published
      # version is treated as success (idempotent on re-runs / source-only bumps).
      - name: Publish server.json to the Official MCP Registry
        if: steps.manifest.outputs.publish_registry == 'true' && github.event.repository.visibility == 'public'
        env:
          MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MCP_REGISTRY_DNS_KEY:-}" ]; then
            echo "::warning::MCP_REGISTRY_DNS_KEY not set — skipping Official MCP Registry publish. npm + GitHub Release are done. Add the Ed25519 private key (matching the chronary.ai DNS TXT record) as a repo secret to enable this."
            exit 0
          fi
          test -f server.json || { echo "::error::server.json not found in mirror tree — cannot publish to MCP Registry." >&2; exit 1; }

          # Warn (don't fail) if server.json version trails the npm package version —
          # the registry would silently no-op on an already-published version.
          SJ_VERSION="$(node -p "require('./server.json').version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${SJ_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::warning::server.json version (${SJ_VERSION}) != package.json version (${PKG_VERSION}). Registry entry may not point at the just-published npm version."
          fi

          # Install the mcp-publisher CLI (linux/amd64 on ubuntu-latest).
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

          ./mcp-publisher login dns --domain=chronary.ai --private-key="${MCP_REGISTRY_DNS_KEY}"

          set +e
          PUBLISH_OUT="$(./mcp-publisher publish 2>&1)"
          PUBLISH_CODE=$?
          set -e
          echo "${PUBLISH_OUT}"
          if [ "${PUBLISH_CODE}" -ne 0 ]; then
            if echo "${PUBLISH_OUT}" | grep -qiE "already exists|already published|conflict|409"; then
              echo "::notice::server.json ${SJ_VERSION} is already in the MCP Registry — treating as success (versions are immutable)."
              exit 0
            fi
            echo "::error::mcp-publisher publish failed (exit ${PUBLISH_CODE})." >&2
            exit "${PUBLISH_CODE}"
          fi
          echo "Published ai.chronary/mcp ${SJ_VERSION} to the Official MCP Registry."
